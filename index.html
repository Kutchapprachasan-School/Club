<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกิจกรรมวิชาชุมนุม - โรงเรียนกุดจับประชาสรรค์</title>
    
    <!-- Critical Inline Styles: เรนเดอร์ Preloader ทันทีใน 0ms ไม่ต้องรอโหลดไฟล์ภายนอก -->
    <style>
        html, body {
            background-color: #0f172a !important;
            margin: 0;
            padding: 0;
        }
        body, button, input, select, textarea, table, span, div, h1, h2, h3, h4 {
            font-family: 'Noto Sans Thai', sans-serif !important;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Native Pre-Loader (แสดงทันที 0ms ป้องกันหน้าจอขาว) ===== */
        #native-preloader {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #0f172a 100%);
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #native-preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .preloader-logo {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: preloaderFloat 2.5s ease-in-out infinite;
        }
        .preloader-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 16px;
        }
        .preloader-title {
            margin-top: 24px;
            font-size: 20px;
            font-weight: 800;
            color: white;
            text-align: center;
            letter-spacing: -0.5px;
            padding: 0 16px;
        }
        .preloader-subtitle {
            margin-top: 6px;
            font-size: 11px;
            color: #c4b5fd;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .preloader-bar-track {
            margin-top: 32px;
            width: 180px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .preloader-bar-fill {
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, #818cf8, #a78bfa, #c084fc);
            border-radius: 4px;
            animation: preloaderSlide 1.5s ease-in-out infinite;
        }
        .preloader-status {
            margin-top: 14px;
            font-size: 12px;
            color: #5eead4;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preloader-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2dd4bf;
            animation: preloaderPing 1.2s ease-in-out infinite;
        }
        .preloader-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.2;
        }
        .preloader-blob-1 { top: -80px; right: -80px; width: 320px; height: 320px; background: #7c3aed; }
        .preloader-blob-2 { bottom: -80px; left: -80px; width: 320px; height: 320px; background: #6366f1; }
        @keyframes preloaderFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes preloaderSlide { 0% { transform: translateX(-100%); } 50% { transform: translateX(200%); } 100% { transform: translateX(-100%); } }
        @keyframes preloaderPing { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.6); } }
    </style>

    <div id="error-display" style="display:none; padding:20px; background:#fee2e2; color:#991b1b; font-family:monospace; border:3px solid #f87171; margin:20px; border-radius:8px; white-space:pre-wrap; z-index:9999; position:relative;">

    <!-- ===== Native Pre-Loader: แสดงทันทีใน 0ms อ่านโลโก้และชื่อชุมนุมจาก Cache ทันที ===== -->
    <div id="native-preloader">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const DEFAULT_LOGO_BASE64 = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'><rect width='100' height='100' rx='20' fill='%230f172a'/><path d='M30 35 L50 20 L70 35 L70 65 L50 80 L30 65 Z' fill='%230284c7' opacity='0.3'/><path d='M35 40 L50 28 L65 40 L65 60 L50 72 L35 60 Z' stroke='%2338bdf8' stroke-width='4' stroke-linejoin='round'/><circle cx='50' cy='50' r='10' fill='%23f59e0b'/><path d='M40 50 L60 50' stroke='white' stroke-width='3'/><path d='M50 40 L50 60' stroke='white' stroke-width='3'/></svg>";

        const parseLevelRoom = (levelStr) => {
            if (!levelStr) return { level: 'ม.1', room: '1' };
            const slashParts = levelStr.split('/');
            if (slashParts.length === 2) {
                return { level: slashParts[0].trim(), room: slashParts[1].trim() };
            }
            const hongParts = levelStr.split('ห้อง');
            if (hongParts.length === 2) {
                return { level: hongParts[0].trim(), room: hongParts[1].trim() };
            }
            return { level: levelStr.trim(), room: '1' };
        };

        function App() {
            // บัญชีผู้ใช้งานที่ล็อกอินปัจจุบัน
            const [currentUser, setCurrentUser] = useState(null);

            // ข้อมูลตารางเรียนและสถิติ
            const [students, setStudents] = useState([]);
            const [records, setRecords] = useState({});
            const [currentDate, setCurrentDate] = useState(() => {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            });

            // สถานะระบบ
            const [isLoading, setIsLoading] = useState(true);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [isOfflineMode, setIsOfflineMode] = useState(false);

            // ตรวจจับความเปลี่ยนแปลงที่ยังไม่ได้บันทึก (Unsaved Changes) สำหรับ Manual Save
            const [isDirty, setIsDirty] = useState(false);

            // การตั้งค่าชุมนุม (ดึงจากแคชท้องถิ่นและคลาวด์ Sheets)
            const [clubName, setClubName] = useState(() => (typeof window !== 'undefined' && localStorage.getItem('gudjap_club_name')) || 'ชุมนุม GAS (Google Apps Script)');
            const [teacherName, setTeacherName] = useState(() => (typeof window !== 'undefined' && localStorage.getItem('gudjap_teacher_name')) || 'ครูสมชาย รักเรียน');
            const [clubLogo, setClubLogo] = useState(() => (typeof window !== 'undefined' && localStorage.getItem('gudjap_club_logo')) || DEFAULT_LOGO_BASE64);
            const [maxCapacity, setMaxCapacity] = useState(40);
            const [rememberMe, setRememberMe] = useState(true);
            const [notification, setNotification] = useState(null);
            const [calendarDate, setCalendarDate] = useState(() => new Date());
            const [gasApiUrlInput, setGasApiUrlInput] = useState(() => (typeof window !== 'undefined' && localStorage.getItem('gudjap_gas_api_url')) || '');

            // ระบบการบ้านและภารกิจ (Assignments & Submissions)
            const [assignments, setAssignments] = useState([]);
            const [submissions, setSubmissions] = useState([]);
            const [showCreateAssignmentModal, setShowCreateAssignmentModal] = useState(false);
            const [editingAssignmentId, setEditingAssignmentId] = useState(null);
            const [newAssignmentTitle, setNewAssignmentTitle] = useState('');
            const [newAssignmentDesc, setNewAssignmentDesc] = useState('');
            const [newAssignmentDueDate, setNewAssignmentDueDate] = useState('');
            const [newAssignmentPoints, setNewAssignmentPoints] = useState(10);
            const [newAssignmentAttachment, setNewAssignmentAttachment] = useState('');
            const [newAssignmentSubmissionType, setNewAssignmentSubmissionType] = useState('all');
            const [activeGradingAssignment, setActiveGradingAssignment] = useState(null);
            const [gradeInputs, setGradeInputs] = useState({});
            const [activeSubmitAssignment, setActiveSubmitAssignment] = useState(null);
            const [submitContent, setSubmitContent] = useState('');
            const [submitLink, setSubmitLink] = useState('');
            const [submitImageBase64, setSubmitImageBase64] = useState('');
            const [submitImagePreview, setSubmitImagePreview] = useState('');
            const [isSubmittingTask, setIsSubmittingTask] = useState(false);

            // ระบบแบ่งหน้าตารางประวัติ (Pagination) & ปฏิทินรายปี (Yearly Calendar)
            const [historyPageSize, setHistoryPageSize] = useState(10);
            const [historyCurrentPage, setHistoryCurrentPage] = useState(1);
            const [calendarViewMode, setCalendarViewMode] = useState('month'); // 'month' | 'year'

            // แท็บเมนูหลัก
            const [activeTab, setActiveTab] = useState('dashboard');
            const [dashboardSubTab, setDashboardSubTab] = useState('individual');
            const [searchTerm, setSearchTerm] = useState('');
            const [filterLevel, setFilterLevel] = useState('ทั้งหมด');
            const [timeRange, setTimeRange] = useState('all'); // ตัวกรองช่วงเวลา: all | month | week | day
            const [studyDay, setStudyDay] = useState('วันพุธ');
            const [studyTime, setStudyTime] = useState('13:00 - 15:00');

            // QR Code เช็คชื่อ
            const [qrCodeUrl, setQrCodeUrl] = useState("");
            const [activePasscode, setActivePasscode] = useState("");
            const [checkinParams, setCheckinParams] = useState(null);

            // แท็บหน้าจอ Login / Register
            const [authTab, setAuthTab] = useState('login'); 
            const [loginUsername, setLoginUsername] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [authError, setAuthError] = useState('');

            // ฟิลด์ลงทะเบียนนักเรียนด้วยตนเอง
            const [regRole, setRegRole] = useState('student');
            const [regPrefix, setRegPrefix] = useState('เด็กชาย');
            const [regName, setRegName] = useState('');
            const [regStudentId, setRegStudentId] = useState('');
            const [regLevel, setRegLevel] = useState('ม.1');
            const [regRoom, setRegRoom] = useState('1');
            const [regUsername, setRegUsername] = useState('');
            const [regPassword, setRegPassword] = useState('');

            // งานแอดมินคุณครู (CRUD)
            const [editingStudent, setEditingStudent] = useState(null);
            const [newStudentId, setNewStudentId] = useState('');
            const [newStudentName, setNewStudentName] = useState('');
            const [newStudentLevel, setNewStudentLevel] = useState('ม.1');
            const [newStudentRoom, setNewStudentRoom] = useState('1');
            const [newStudentPrefix, setNewStudentPrefix] = useState('เด็กชาย');

            // 🔄 Auto-Retry ฟังก์ชันยิง API ฝั่ง Client ร่วมกับ Client Timeout Protection
            const callServerWithRetry = (serverMethodName, args, onSuccess, onFailure, maxRetries = 1) => {
                let attempt = 0;
                let finished = false;

                const execute = () => {
                    attempt++;
                    const timeoutMs = (serverMethodName.includes('submit') || serverMethodName.includes('save') || serverMethodName.includes('update')) ? 45000 : 20000;
                    const timer = setTimeout(() => {
                        if (!finished) {
                            finished = true;
                            onFailure(new Error("การเชื่อมต่อหมดเวลา (Timeout) กรุณาลองใหม่อีกครั้ง"));
                        }
                    }, timeoutMs);

                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler((res) => {
                                if (finished) return;
                                finished = true;
                                clearTimeout(timer);
                                onSuccess(res);
                            })
                            .withFailureHandler((err) => {
                                if (finished) return;
                                clearTimeout(timer);
                                const msg = String((err && err.message) || err);
                                const isConcurrentError = msg.includes("simultaneous") || msg.includes("LockService") || msg.includes("ยุ่งอยู่");
                                if (isConcurrentError && attempt <= maxRetries) {
                                    const jitter = Math.floor(Math.random() * 1000) + 500;
                                    setTimeout(execute, jitter);
                                } else {
                                    finished = true;
                                    onFailure(err);
                                }
                            })[serverMethodName](...args);
                    } else {
                        // เมื่อรันบน GitHub Pages -> ใช้ Fetch API ยิง REST API ไปยัง Google Apps Script Backend (GET/POST CORS Safe)
                        const defaultGasUrl = "https://script.google.com/macros/s/1FTTeb8fSgisUr5JAsgGMsRhiyQrLShmu5Wzmc_N9Z2ahxxIgTHP3YxjB/exec";
                        const apiUrl = (typeof window !== 'undefined' && localStorage.getItem('gudjap_gas_api_url')) || defaultGasUrl;
                        
                        const jsonArgs = JSON.stringify(args);

                        // ฟังก์ชันส่ง POST (สำหรับข้อมูลขนาดใหญ่หรือส่งงาน/การบ้าน)
                        const sendPostRequest = () => {
                            const params = new URLSearchParams();
                            params.append('action', serverMethodName);
                            params.append('args', jsonArgs);
                            
                            fetch(apiUrl, {
                                method: 'POST',
                                body: params,
                                redirect: 'follow'
                            })
                            .then(res => res.json())
                            .then(res => {
                                if (finished) return;
                                finished = true;
                                clearTimeout(timer);
                                onSuccess(res);
                            })
                            .catch(err2 => {
                                if (finished) return;
                                clearTimeout(timer);
                                if (attempt <= maxRetries) {
                                    setTimeout(execute, 1000);
                                } else {
                                    finished = true;
                                    onFailure(err2);
                                }
                            });
                        };

                        // หากอาร์กิวเมนต์มีขนาดใหญ่เกิน 500 ตัวอักษร หรือเป็นเมธอดส่งงาน/บันทึก ให้ส่ง POST โดยตรงทันที
                        if (jsonArgs.length > 500 || serverMethodName.includes('submit') || serverMethodName.includes('save') || serverMethodName.includes('update') || serverMethodName.includes('grade')) {
                            sendPostRequest();
                        } else {
                            const getUrl = `${apiUrl}?action=${encodeURIComponent(serverMethodName)}&args=${encodeURIComponent(jsonArgs)}&t=${Date.now()}`;
                            fetch(getUrl, { redirect: 'follow' })
                            .then(res => res.json())
                            .then(res => {
                                if (finished) return;
                                finished = true;
                                clearTimeout(timer);
                                onSuccess(res);
                            })
                            .catch(err => {
                                sendPostRequest();
                            });
                        }
                    }
                };
                execute();
            };

            // ตรวจสอบวันเรียนและสถานะเช็คชื่อสำหรับหน้า Dashboard แจ้งเตือนครู
            const todayFormatted = useMemo(() => {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }, []);

            // ฟังก์ชันแปลงรูปแบบวันที่ YYYY-MM-DD เป็น วัน เดือน ปี ภาษาไทย (เช่น 5 สิงหาคม 2569)
            const formatThaiDate = (dateStr) => {
                if (!dateStr) return '';
                const parts = String(dateStr).trim().split('-');
                if (parts.length !== 3) return dateStr;
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const day = parseInt(parts[2], 10);
                const thaiMonths = [
                    'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
                ];
                if (isNaN(year) || isNaN(month) || isNaN(day) || month < 0 || month > 11) return dateStr;
                return `${day} ${thaiMonths[month]} ${year + 543}`;
            };

            const isStudyDayToday = useMemo(() => {
                const daysOfWeekTh = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
                const today = new Date();
                const todayDayTh = daysOfWeekTh[today.getDay()];
                return todayDayTh === studyDay;
            }, [studyDay]);

            const hasCheckedToday = useMemo(() => {
                return records[todayFormatted] && Object.keys(records[todayFormatted]).length > 0;
            }, [records, todayFormatted]);

            const showToast = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            // เรียกโหลดข้อมูลทั้งหมดก่อนเริ่มแสดงผลเว็บ และตรวจสอบ Cache การล็อกอิน
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get("checkin") === "true") {
                    setCheckinParams({
                        date: params.get("date"),
                        passcode: params.get("passcode")
                    });
                }
                loadAllData();
            }, []);

            // อัปเดตชื่อหัวเว็บ (Browser Tab Title) ตามชื่อชุมนุมที่ตั้งค่าไว้อัตโนมัติ
            useEffect(() => {
                if (clubName) {
                    document.title = clubName + ' - โรงเรียนกุดจับประชาสรรค์';
                }
            }, [clubName]);

            const loadAllData = () => {
                setIsLoading(true);
                setIsOfflineMode(false);
                callServerWithRetry(
                    'getDatabaseData',
                    [],
                    (response) => {

            const compressImageToBase64 = (file, maxWidth = 1280, quality = 0.8) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                            resolve(compressedBase64);
                        };
                        img.onerror = (err) => reject(err);
                        img.src = event.target.result;
                    };
                    reader.onerror = (err) => reject(err);
                    reader.readAsDataURL(file);
                });
            };

            const handleRegisterSubmit = (e) => {

                        setAuthTab('login');

            // ดึงประวัติเข้าเช็คชื่อย้อนหลัง (History Edit CRUD)
            const handleEditHistoryDay = (dateToEdit) => {

            // บันทึกแก้ไขรายชื่อนักเรียนบนชีต (สำหรับครู CRUD)
            const saveAllStudentsToSheet = (updatedStudentsList) => {

                        })
                        .withFailureHandler(() => { setIsSaving(false); })
                        .updateStudentsOnSheet(JSON.stringify(updatedStudentsList), currentUser.username, loginPassword);
                } else {
                    setTimeout(() => { setIsSaving(false); showToast('[จำลอง] บันทึกรายชื่อเรียบร้อย'); }, 500);
                }
            };

            // บันทึกการตั้งค่าชุมนุมบนชีต (สำหรับครู)
            const saveSettingsToSheet = (targetClubName, targetTeacherName, targetLogo, targetCapacity, targetStudyDay, targetStudyTime) => {
                setIsSaving(true);
                const capacityToSend = targetCapacity !== undefined ? targetCapacity : maxCapacity;
                const studyDayToSend = targetStudyDay !== undefined ? targetStudyDay : studyDay;
                const studyTimeToSend = targetStudyTime !== undefined ? targetStudyTime : studyTime;

                        .withSuccessHandler((success) => {

                        .saveSettingsOnSheet(targetClubName, targetTeacherName, targetLogo, capacityToSend, studyDayToSend, studyTimeToSend, currentUser.username, loginPassword);
                } else {
                    setTimeout(() => { setIsSaving(false); showToast('[จำลอง] บันทึกการตั้งค่าเรียบร้อย'); }, 500);
                }
            };

            // สร้าง QR Code เช็คชื่อ
            const handleGenerateQR = () => {
                const pin = Math.floor(100000 + Math.random() * 900000).toString();
                setActivePasscode(pin);
                
                const baseUrl = window.location.href.split('?')[0];
                const checkinUrl = `${baseUrl}?checkin=true&date=${currentDate}&passcode=${pin}`;
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(checkinUrl)}`;
                
                setQrCodeUrl(qrUrl);
                
                if (isOfflineMode) {
                    showToast(`[จำลอง] สร้างรหัสเช็คชื่อสำเร็จคือ ${pin}`);

                    const authUser = currentUser?.username || 'admin';
                    const authPass = loginPassword || '';
                    callServerWithRetry(
                        'saveCheckinSettings',
                        [currentDate, pin, authUser, authPass],
                        (res) => {
                            showToast("เปิดรับลงทะเบียน QR Code สำเร็จ");
                        },
                        (err) => {
                            showToast(`เปิดรับลงทะเบียน QR Code (รหัส: ${pin}) สำเร็จแล้ว`);
                        },
                        1
                    );
                }
            };

            // ออกจากระบบ
            const handleLogout = () => {
                setCurrentUser(null);
                setLoginUsername('');
                setLoginPassword('');
                if (typeof window !== 'undefined') {
                    localStorage.removeItem('gudjap_user');
                    localStorage.removeItem('gudjap_pass');
                    sessionStorage.removeItem('gudjap_pass');
                }
                showToast('ออกจากระบบเรียบร้อยแล้ว', 'info');
            };

            // เช็คชื่อรายวัน (บันทึกลงหน่วยความจำชั่วคราว)
            const handleLocalStatusChange = (studentId, status) => {
                if (currentUser?.role !== 'teacher') return;
                const updatedDayRecord = records[currentDate] ? { ...records[currentDate] } : {};
                updatedDayRecord[studentId] = status;
                setRecords(prev => ({ ...prev, [currentDate]: updatedDayRecord }));
                setIsDirty(true); // เปลี่ยนสถานะเป็น Unsaved Changes
            };

            // มาร์กทุกคนมาเรียน (Local State)
            const markAllPresentLocal = () => {
                if (currentUser?.role !== 'teacher') return;
                const updatedDayRecord = {};
                students.forEach(st => {
                    if (st.role !== 'teacher') {
                        updatedDayRecord[st.studentId] = 'present';
                    }
                });
                setRecords(prev => ({ ...prev, [currentDate]: updatedDayRecord }));
                setIsDirty(true);
            };

            // สกัดเกรดตัวเลข (1-6) จากระดับชั้น
            const extractGradeLevel = (levelStr) => {
                if (!levelStr) return null;
                const cleanStr = String(levelStr).trim();
                const match = cleanStr.match(/(?:ม\.|มัธยมศึกษาปีที่)\s*(\d+)/i);
                if (match) {
                    return parseInt(match[1], 10);
                }
                return null;
            };

            // ค้นหารายชื่อ
            const filteredStudents = useMemo(() => {
                return students
                    .filter(student => student.role !== 'teacher')
                    .filter(student => {
                        const matchesSearch = student.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                              student.studentId.includes(searchTerm);
                        // กรองระดับชั้น ม.ต้น / ม.ปลาย / ห้องเรียน
                        const matchesLevel = (() => {
                            if (filterLevel === 'ทั้งหมด') return true;
                            const grade = extractGradeLevel(student.level);
                            if (filterLevel === 'ม.ต้น') {
                                return grade >= 1 && grade <= 3;
                            }
                            if (filterLevel === 'ม.ปลาย') {
                                return grade >= 4 && grade <= 6;
                            }
                            return student.level.includes(filterLevel) || student.level === filterLevel;
                        })();
                        return matchesSearch && matchesLevel;
                    });
            }, [students, searchTerm, filterLevel]);

            // ตัวกรองช่วงสถิติสะสม
            const filteredRecords = useMemo(() => {
                const result = {};
                const anchorDate = new Date(currentDate);
                if (isNaN(anchorDate.getTime())) return records;

                Object.keys(records).forEach(dateStr => {
                    const recordDate = new Date(dateStr);
                    if (isNaN(recordDate.getTime())) {
                        result[dateStr] = records[dateStr];
                        return;
                    }

                    const diffTime = anchorDate - recordDate;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (timeRange === 'day') {
                        if (dateStr === currentDate) {
                            result[dateStr] = records[dateStr];
                        }
                    } else if (timeRange === 'week') {
                        if (diffDays >= 0 && diffDays < 7) {
                            result[dateStr] = records[dateStr];
                        }
                    } else if (timeRange === 'month') {
                        if (diffDays >= 0 && diffDays < 30) {
                            result[dateStr] = records[dateStr];
                        }
                    } else {
                        result[dateStr] = records[dateStr];
                    }
                });
                return result;
            }, [records, timeRange, currentDate]);

            // สถิติรายบุคคลสะสม
            const studentStatsMap = useMemo(() => {
                const statsMap = {};
                students.forEach(st => {
                    if (st.role !== 'teacher') {
                        let present = 0, late = 0, leave = 0, absent = 0;
                        Object.values(filteredRecords).forEach(dayRecord => {
                            const status = dayRecord[st.studentId];
                            if (status === 'present') present++;
                            else if (status === 'late') late++;
                            else if (status === 'leave') leave++;
                            else if (status === 'absent') absent++;
                        });
                        const totalDays = present + late + leave + absent;
                        const attendanceRate = totalDays > 0 ? Math.round(((present + late) / totalDays) * 100) : 100;
                        const isPassed = attendanceRate >= 80;
                        statsMap[st.studentId] = { present, late, leave, absent, totalDays, attendanceRate, isPassed };
                    }
                });
                return statsMap;
            }, [students, filteredRecords]);

            // ภาพรวมการเข้าเรียนสะสม
            const totalAggregateStats = useMemo(() => {
                let present = 0, late = 0, leave = 0, absent = 0;
                Object.values(filteredRecords).forEach(dayRecord => {
                    students.forEach(st => {
                        const status = dayRecord[st.studentId];
                        if (status === 'present') present++;
                        else if (status === 'late') late++;
                        else if (status === 'leave') leave++;
                        else if (status === 'absent') absent++;
                    });
                });
                const total = present + late + leave + absent;
                return { total, present, late, leave, absent };
            }, [filteredRecords, students]);

            // ดึงสถิตินักเรียนเฉพาะตนเอง
            const myPersonalStats = useMemo(() => {
                if (!currentUser || currentUser.role !== 'student') return null;
                return studentStatsMap[currentUser.studentId] || { present: 0, late: 0, leave: 0, absent: 0, totalDays: 0, attendanceRate: 0, isPassed: false };
            }, [currentUser, studentStatsMap]);

            // คัดลอกข้อมูลรายวัน
            const copyToClipboard = () => {
                const dayRecord = records[currentDate] || {};
                let txt = `ผลการเช็คชื่อวิชาชุมนุม ${clubName} ประจำวันที่ ${currentDate}\n`;
                txt += `รหัสนักเรียน,ชื่อ-นามสกุล,ระดับชั้น,สถานะ\n`;
                students.forEach(st => {
                    if (st.role !== 'teacher') {
                        const statusRaw = dayRecord[st.studentId];
                        let statusTh = 'มาเรียน';
                        if (statusRaw === 'absent') statusTh = 'ขาดเรียน';
                        else if (statusRaw === 'late') statusTh = 'สาย';
                        else if (statusRaw === 'leave') statusTh = 'ลา';
                        txt += `${st.studentId},${st.prefix || ''}${st.name},${st.level},${statusTh}\n`;
                    }
                });

                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = txt;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    showToast('คัดลอกข้อมูลรายวันเรียบร้อย', 'success');
                } catch (err) {
                    showToast('เกิดข้อผิดพลาดในการคัดลอก', 'error');
                }
                document.body.removeChild(tempTextArea);
            };

            const copyIndividualReportToClipboard = () => {
                let txt = `สรุปผลกิจกรรมชุมนุมสะสมรายบุคคล - วิชา ${clubName} (ช่วงเวลาที่เลือกกรอง)\n`;
                txt += `รหัสนักเรียน,ชื่อ-นามสกุล,ระดับชั้น,มา (คาบ),สาย (คาบ),ลา (คาบ),ขาด (คาบ),วันเรียนรวม,เวลาเข้าเรียน,ผลประเมิน\n`;
                students.forEach(st => {
                    if (st.role !== 'teacher') {
                        const stats = studentStatsMap[st.studentId] || { present: 0, late: 0, leave: 0, absent: 0, totalDays: 0, attendanceRate: 0, isPassed: false };
                        const evalStatus = stats.attendanceRate >= 80 ? 'ผ่าน' : 'ม.ส.';
                        txt += `${st.studentId},${st.prefix || ''}${st.name},${st.level},${stats.present},${stats.late},${stats.leave},${stats.absent},${stats.totalDays},${stats.attendanceRate}%,${evalStatus}\n`;
                    }
                });

                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = txt;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    showToast('คัดลอกข้อมูลรายงานสถิติสำเร็จ', 'success');
                } catch (err) {
                    showToast('คัดลอกล้มเหลว', 'error');
                }
                document.body.removeChild(tempTextArea);
            };

            // CRUD: การเพิ่มนักเรียนฝั่งแอดมินครู
            const handleAddStudent = (e) => {
                e.preventDefault();
                if (currentUser?.role !== 'teacher') return;
                if (!newStudentId.trim() || !newStudentName.trim()) {
                    showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
                    return;
                }
                if (students.some(st => st.studentId === newStudentId)) {
                    showToast('รหัสนักเรียนนี้ซ้ำในฐานข้อมูล', 'error');
                    return;
                }

                const newStudent = {
                    id: Date.now().toString(),
                    studentId: newStudentId,
                    prefix: newStudentPrefix,
                    name: newStudentName,
                    level: `${newStudentLevel}/${newStudentRoom}`,
                    username: newStudentId,
                    role: 'student'
                };

                const updatedStudentsList = [...students, newStudent];
                setStudents(updatedStudentsList);
                
                const updatedRecords = { ...records };
                if (updatedRecords[currentDate]) {
                    updatedRecords[currentDate][newStudentId] = 'present';
                    setRecords(updatedRecords);
                    saveAttendanceToSheet(currentDate, updatedRecords[currentDate]);
                }

                saveAllStudentsToSheet(updatedStudentsList);

                setNewStudentId('');
                setNewStudentName('');
                showToast('ลงทะเบียนเข้าเรียนชุมนุมเรียบร้อยแล้ว');
            };

            // การนำเข้ารายชื่อผ่านไฟล์ CSV
            const [csvPreview, setCsvPreview] = useState([]);
            const handleCsvUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    const rows = text.split("\n").map(r => r.trim()).filter(r => r);
                    if (rows.length <= 1) {
                        showToast("ไฟล์ CSV ไม่มีข้อมูลหรือรูปแบบไม่ถูกต้อง", "error");
                        return;
                    }
                    
                    const parsed = [];
                    for (let i = 1; i < rows.length; i++) {
                        const cols = rows[i].split(",").map(c => c.trim().replace(/^["']|["']$/g, ''));
                        if (cols.length >= 4) {
                            parsed.push({
                                studentId: cols[0],
                                prefix: cols[1],
                                name: cols[2],
                                level: cols[3],
                                username: cols[0],
                                password: "1234"
                            });
                        }
                    }
                    if (parsed.length === 0) {
                        showToast("ไม่สามารถประมวลข้อมูลจากไฟล์ CSV ได้ ตรวจสอบตัวคั่นลูกน้ำ (,)", "error");
                        return;
                    }
                    setCsvPreview(parsed);
                };
                reader.readAsText(file, "UTF-8");
                e.target.value = ""; // Reset file input
            };

            // CRUD: แก้ไขข้อมูลนักเรียน (แก้ไขบั๊ก Prefix & Level ครบถ้วน)
            const handleUpdateStudent = (e) => {
                e.preventDefault();
                if (currentUser?.role !== 'teacher') return;
                if (!editingStudent.name.trim() || !editingStudent.studentId.trim()) {
                    showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'error');
                    return;
                }

                const isIdDup = students.some(st => st.id !== editingStudent.id && st.studentId === editingStudent.studentId);
                if (isIdDup) {
                    showToast('รหัสนักเรียนซ้ำกับฐานข้อมูลรายอื่น', 'error');
                    return;
                }

                const finalLevel = editingStudent.levelOnly === 'ครู' ? 'ครู' : `${editingStudent.levelOnly || 'ม.1'}/${editingStudent.roomOnly || '1'}`;
                const studentToSave = {
                    ...editingStudent,
                    level: finalLevel
                };
                delete studentToSave.levelOnly;
                delete studentToSave.roomOnly;

                const oldStudent = students.find(st => st.id === editingStudent.id);
                const updatedList = students.map(st => st.id === editingStudent.id ? studentToSave : st);
                setStudents(updatedList);

                if (oldStudent && oldStudent.studentId !== editingStudent.studentId) {
                    const updatedRecords = { ...records };
                    Object.keys(updatedRecords).forEach(date => {
                        if (updatedRecords[date][oldStudent.studentId]) {
                            updatedRecords[date][editingStudent.studentId] = updatedRecords[date][oldStudent.studentId];
                            delete updatedRecords[date][oldStudent.studentId];
                            saveAttendanceToSheet(date, updatedRecords[date]);
                        }
                    });
                    setRecords(updatedRecords);
                }

                saveAllStudentsToSheet(updatedList);
                setEditingStudent(null);
                showToast('แก้ไขข้อมูลนักเรียนสำเร็จ');
            };

            // CRUD: ลบนักเรียน
            const handleDeleteStudent = (studentId) => {
                if (currentUser?.role !== 'teacher') return;
                if (confirm(`คุณต้องการคัดชื่อนักเรียนรหัส ${studentId} ออกจากวิชาชุมนุมใช่หรือไม่?`)) {
                    const updatedList = students.filter(st => st.studentId !== studentId);
                    setStudents(updatedList);

                    const updatedRecords = { ...records };
                    Object.keys(updatedRecords).forEach(date => {
                        if (updatedRecords[date][studentId]) {
                            delete updatedRecords[date][studentId];
                            saveAttendanceToSheet(date, updatedRecords[date]);
                        }
                    });
                    setRecords(updatedRecords);

                    saveAllStudentsToSheet(updatedList);
                    showToast('นำชื่อออกและประวัติสำเร็จแล้ว', 'info');
                }
            };

            // อัปโหลดรูปภาพโลโก้กิจกรรม
            const handleLogoChange = (e) => {
                if (currentUser?.role !== 'teacher') return;
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 800 * 1024) { 
                        showToast('ขนาดรูปภาพต้องห้ามเกิน 800KB', 'error');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setClubLogo(reader.result);
                        saveSettingsToSheet(clubName, teacherName, reader.result);
                        showToast('ปรับปรุงรูปโลโก้ชุมนุมสำเร็จ');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const resetLogoToDefault = () => {
                if (currentUser?.role !== 'teacher') return;
                setClubLogo(DEFAULT_LOGO_BASE64);
                saveSettingsToSheet(clubName, teacherName, DEFAULT_LOGO_BASE64, maxCapacity, studyDay, studyTime);
                showToast('คืนสัญลักษณ์ชุมนุมเริ่มต้นเสร็จสิ้น');
            };

            const handleSettingsSave = () => {
                if (currentUser?.role !== 'teacher') return;
                saveSettingsToSheet(clubName, teacherName, clubLogo, maxCapacity, studyDay, studyTime);
                showToast('บันทึกการตั้งค่าระบบลง Google Sheets แล้ว');
            };

            const renderHistoryStats = () => {
                const dates = Object.keys(records).sort().reverse();
                if (dates.length === 0) return <p className="text-gray-500 text-center py-4">ไม่พบประวัติการเข้าเรียนในชีต Attendance</p>;

                return (
                    <div className="space-y-4 font-semibold text-slate-800">
                        {dates.map(date => {

                                else if (status === 'late') late++;
                                else if (status === 'leave') leave++;

                            const rate = total > 0 ? Math.round((present / total) * 100) : 0;

                                </form>
                            </div>

                                    {(activeSubmitAssignment.submissionType === 'text' || activeSubmitAssignment.submissionType === 'all' || !activeSubmitAssignment.submissionType) && (

                                            <label className="text-xs font-bold text-slate-600 block mb-1">📝 คำตอบ / รายละเอียดงานที่ส่ง</label>

                                                        >
                                                            ✕
                                                        </button>
                                                    </div>

                                                    <label className="cursor-pointer block">
                                                        <span className="text-2xl block mb-1">📸</span>

                                                            type="file" 
                                                            accept="image/jpeg,image/png,image/webp" 
                                                            onChange={async (e) => {
                                                                const file = e.target.files[0];

                                                                    try {
                                                                        const base64 = await compressImageToBase64(file);
                                                                        setSubmitImageBase64(base64);
                                                                        setSubmitImagePreview(base64);
                                                                    } catch (err) {
                                                                        showToast('ประมวลผลรูปภาพล้มเหลว', 'error');
                                                                    }
                                                                }
                                                            }}
                                                            className="hidden" 
                                                        />
                                                    </label>
                                                )}
                                            </div>

                                            {isSubmittingTask ? (
                                                <>

                                    </div>
                                </form>
                            </div>
                        </div>

                                                    </div>

                                                    <div className="bg-white p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                                                        {sub.content && <p className="font-bold text-slate-700">เนื้อหา: <span className="font-normal text-slate-600">{sub.content}</span></p>}
                                                        {sub.link && (
                                                            <p className="font-bold text-slate-700">ลิงก์: <a href={sub.link} target="_blank" rel="noreferrer" className="text-teal-600 underline font-bold">{sub.link} ↗</a></p>
                                                        )}
                                                        {sub.imageUrl && (
                                                            <div className="pt-1.5">
                                                                <p className="font-bold text-slate-700 mb-1">🖼️ รูปภาพผลงาน:</p>
                                                                <a href={sub.imageUrl} target="_blank" rel="noreferrer" className="inline-block group relative">
                                                                    <img src={sub.imageUrl} alt="Student Work" className="max-h-48 rounded-xl border border-slate-200 object-contain shadow-xs group-hover:opacity-90 transition-all" />
                                                                    <span className="absolute bottom-2 right-2 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-md font-bold backdrop-blur-xs">🔍 คลิกเพื่อเปิดขยายรูปเต็ม</span>
                                                                </a>
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 items-center">
                                                        <div>
                                                            <input 
                                                                type="number" 
                                                                min="0" 
                                                                max={activeGradingAssignment.points}
                                                                placeholder={`คะแนน (เต็ม ${activeGradingAssignment.points})`}
                                                                value={currentInput.score}
                                                                onChange={(e) => setGradeInputs({ ...gradeInputs, [sub.id]: { ...currentInput, score: e.target.value } })}
                                                                className="w-full px-3 py-1.5 bg-white border rounded-xl text-xs font-bold focus:ring-2 focus:ring-teal-400"
                                                            />
                                                        </div>
                                                        <div>
                                                            <input 
                                                                type="text" 
                                                                placeholder="ข้อคิดเห็น / คำติชม..."
                                                                value={currentInput.feedback}
                                                                onChange={(e) => setGradeInputs({ ...gradeInputs, [sub.id]: { ...currentInput, feedback: e.target.value } })}
                                                                className="w-full px-3 py-1.5 bg-white border rounded-xl text-xs font-medium focus:ring-2 focus:ring-teal-400"
                                                            />
                                                        </div>
                                                        <div>
                                                            <button 
                                                                onClick={() => handleGradeSubmission(sub.id, currentInput.score, currentInput.feedback)}
                                                                className="w-full py-1.5 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded-xl shadow-xs transition-all active:scale-95 cursor-pointer"
                                                            >
                                                                บันทึกคะแนน
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        });
                                    })()}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* หน้าต่างแก้ไขรายชื่อในชีตผ่านป๊อปอัป Modal (U ใน CRUD - แก้ไขบั๊ก Prefix & Level ครบถ้วน) */}
                    {editingStudent && currentUser?.role === 'teacher' && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-xs">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full border p-6 animate-in fade-in zoom-in-95 duration-200">
                                <div className="flex items-center justify-between mb-4 border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800">แก้ไขข้อมูลนักเรียน</h3>
                                    <button onClick={() => setEditingStudent(null)} className="text-slate-400 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleUpdateStudent} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 block mb-1">รหัสประจำตัวนักเรียน</label>
                                        <input type="text" required value={editingStudent.studentId} onChange={(e) => setEditingStudent({ ...editingStudent, studentId: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-xl text-sm font-semibold" />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 block mb-1">คำนำหน้า</label>
                                            <select 
                                                value={editingStudent.prefix || 'เด็กชาย'} 
                                                onChange={(e) => setEditingStudent({ ...editingStudent, prefix: e.target.value })} 
                                                className="w-full px-2 py-2 border border-gray-300 rounded-xl text-xs font-semibold focus:ring-2"
                                            >
                                                <option value="เด็กชาย">เด็กชาย</option>
                                                <option value="เด็กหญิง">เด็กหญิง</option>
                                                <option value="นาย">นาย</option>
                                                <option value="นางสาว">นางสาว</option>
                                                <option value="นาง">นาง</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2">
                                            <label className="text-xs font-bold text-slate-500 block mb-1">ชื่อ - นามสกุล</label>
                                            <input type="text" required value={editingStudent.name} onChange={(e) => setEditingStudent({ ...editingStudent, name: e.target.value })} className="w-full px-4 py-2 border border-gray-300 rounded-xl text-sm font-semibold" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 block mb-1">ระดับชั้นเรียน</label>
                                        <div className={editingStudent.levelOnly !== 'ครู' ? "grid grid-cols-2 gap-2" : ""}>
                                            <div>
                                                <select
                                                    value={editingStudent.levelOnly || 'ม.1'}
                                                    onChange={(e) => setEditingStudent({ ...editingStudent, levelOnly: e.target.value })}
                                                    className="w-full px-2 py-2.5 bg-white border border-gray-300 rounded-xl text-xs font-semibold focus:ring-2"
                                                >
                                                    <option value="ม.1">ม.1</option>
                                                    <option value="ม.2">ม.2</option>
                                                    <option value="ม.3">ม.3</option>
                                                    <option value="ม.4">ม.4</option>
                                                    <option value="ม.5">ม.5</option>
                                                    <option value="ม.6">ม.6</option>
                                                    <option value="ครู">ครู</option>
                                                </select>
                                            </div>
                                            {editingStudent.levelOnly !== 'ครู' && (
                                                <div>
                                                    <select
                                                        value={editingStudent.roomOnly || '1'}
                                                        onChange={(e) => setEditingStudent({ ...editingStudent, roomOnly: e.target.value })}
                                                        className="w-full px-2 py-2.5 bg-white border border-gray-300 rounded-xl text-xs font-semibold focus:ring-2"
                                                    >
                                                        <option value="1">ห้อง 1</option>
                                                        <option value="2">ห้อง 2</option>
                                                        <option value="3">ห้อง 3</option>
                                                        <option value="4">ห้อง 4</option>
                                                        <option value="5">ห้อง 5</option>
                                                        <option value="6">ห้อง 6</option>
                                                        <option value="7">ห้อง 7</option>
                                                        <option value="8">ห้อง 8</option>
                                                        <option value="9">ห้อง 9</option>
                                                        <option value="10">ห้อง 10</option>
                                                    </select>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div className="flex gap-2 pt-3 border-t">
                                        <button type="submit" className="flex-1 bg-teal-600 text-white font-bold py-2 rounded-xl text-sm shadow-md">บันทึกการแก้ไข</button>
                                        <button type="button" onClick={() => setEditingStudent(null)} className="flex-1 bg-slate-100 text-slate-700 font-bold py-2 rounded-xl text-sm">ยกเลิก</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* หน้าต่างตรวจสอบรายชื่อนำเข้า CSV */}
                    {csvPreview.length > 0 && currentUser?.role === 'teacher' && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-xs">
                            <div className="bg-white rounded-3xl p-6 max-w-2xl w-full max-h-[80vh] flex flex-col shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                                <h3 className="text-lg font-black text-slate-800 mb-2">ตรวจสอบรายชื่อนำเข้า ({csvPreview.length} รายการ)</h3>
                                <p className="text-xs text-slate-400 mb-4">ข้อมูลรหัสนักเรียนหรือชื่อผู้ใช้ที่ซ้ำในระบบจะถูกข้ามโดยอัตโนมัติ</p>
                                <div className="overflow-y-auto flex-1 border rounded-2xl mb-4 text-xs">
                                    <table className="w-full text-left">
                                        <thead className="bg-slate-50 border-b">
                                            <tr className="font-bold text-slate-600">
                                                <th className="p-3">รหัส</th>
                                                <th className="p-3">คำนำหน้า</th>
                                                <th className="p-3">ชื่อ-นามสกุล</th>
                                                <th className="p-3">ระดับชั้น</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {csvPreview.map((st, idx) => (
                                                <tr key={idx} className="hover:bg-slate-50">
                                                    <td className="p-3 font-mono font-bold">{st.studentId}</td>
                                                    <td className="p-3">{st.prefix}</td>
                                                    <td className="p-3 font-bold">{st.name}</td>
                                                    <td className="p-3">{st.level}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {
                                            setIsSaving(true);
                                            if (isOfflineMode) {
                                                setStudents(prev => [...prev, ...csvPreview]);
                                                showToast(`[จำลอง] นำเข้าสำเร็จ ${csvPreview.length} คน`);
                                                setCsvPreview([]);
                                                setIsSaving(false);
                                            } else {
                                                google.script.run
                                                    .withSuccessHandler((res) => {
                                                        setIsSaving(false);
                                                        if (res.success) {
                                                            showToast(`นำเข้าสำเร็จ ${res.count} คน`);
                                                            loadAllData();
                                                            setCsvPreview([]);
                                                        } else {
                                                            showToast(res.message, "error");
                                                        }
                                                    })
                                                    .withFailureHandler((err) => { 
                                                        setIsSaving(false); 
                                                        showToast(err.message, "error");
                                                    })
                                                    .importStudentsOnSheet(JSON.stringify(csvPreview), currentUser.username, loginPassword);
                                            }
                                        }}
                                        className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm shadow-md"
                                    >
                                        ยืนยันนำเข้าข้อมูล
                                    </button>
                                    <button onClick={() => setCsvPreview([])} className="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl text-sm">
                                        ยกเลิก
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* หน้าต่างแสดง QR Code เช็คชื่อประจำวัน */}
                    {qrCodeUrl && currentUser?.role === 'teacher' && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-xs">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="text-lg font-black text-slate-800">QR Code เช็คชื่อประจำวัน</h3>
                                    <button onClick={() => setQrCodeUrl("")} className="text-slate-400 font-bold">✕</button>
                                </div>
                                <div className="flex justify-center p-2 bg-slate-50 rounded-2xl border">
                                    <img src={qrCodeUrl} alt="Check-in QR Code" className="w-60 h-60 object-contain rounded-xl animate-pulse" />
                                </div>
                                <p className="text-sm font-bold text-slate-700">รหัสผ่านยืนยัน: <span className="text-violet-600 text-lg font-black">{activePasscode}</span></p>
                                <p className="text-xs text-slate-400">สแกนเพื่อเข้าสู่หน้าเว็บพร้อมเช็คชื่อเข้าเรียนของวันที่ <strong>{formatThaiDate(currentDate)}</strong> ทันที</p>
                                <button onClick={() => setQrCodeUrl("")} className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm">
                                    ปิดหน้าต่าง
                                </button>
                            </div>
                        </div>
                    )}

                    {/* หน้าต่างยืนยันการเช็คชื่อของนักเรียนผ่าน QR Code (Self Check-in) */}
                    {checkinParams && currentUser && currentUser.role === 'student' && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-xs">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                                <span className="text-emerald-600 font-bold bg-emerald-50 px-3 py-1 rounded-full text-xs inline-block">📱 Self Check-in (เช็คชื่อด้วยตัวเอง)</span>
                                <h2 className="text-xl font-black text-slate-800">ยืนยันเข้าเรียนวิชาชุมนุม</h2>
                                <div className="bg-slate-50 p-4 rounded-2xl border text-left space-y-2 text-sm text-slate-600">
                                    <p>🏫 วิชาชุมนุม: <strong className="text-slate-800">{clubName}</strong></p>
                                    <p>📅 ประจำวันที่: <strong className="text-slate-800">{formatThaiDate(checkinParams.date)}</strong></p>
                                    <p>👤 ผู้เช็คชื่อ: <strong className="text-slate-800">{currentUser.prefix || ''}{currentUser.name}</strong></p>
                                </div>
                                <button 
                                    onClick={() => {
                                        setIsSaving(true);
                                        if (isOfflineMode) {
                                            setRecords(prev => {
                                                const today = prev[checkinParams.date] || {};
                                                today[currentUser.studentId] = "present";
                                                return { ...prev, [checkinParams.date]: today };
                                            });
                                            setIsSaving(false);
                                            showToast("เช็คชื่อสำเร็จ (โหมดทดสอบ)");
                                            setCheckinParams(null);
                                        } else {
                                            google.script.run
                                                .withSuccessHandler((res) => {
                                                    setIsSaving(false);
                                                    if (res.success) {
                                                        showToast("เช็คชื่อเข้าเรียนสำเร็จแล้ว!");
                                                        setCheckinParams(null);
                                                        loadAllData();
                                                    } else {
                                                        showToast(res.message, "error");
                                                    }
                                                })
                                                .withFailureHandler((err) => { 
                                                    setIsSaving(false); 
                                                    showToast(err.message, "error");
                                                })
                                                .checkInStudent(currentUser.studentId, checkinParams.date, checkinParams.passcode, currentUser.username, loginPassword);
                                        }
                                    }}
                                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all"
                                >
                                    ยืนยันการเข้าเรียน
                                </button>
                                <button onClick={() => setCheckinParams(null)} className="w-full text-slate-400 hover:text-slate-500 font-bold text-xs">
                                    เข้าสู่หน้าหลักโดยไม่เช็คชื่อ
                                </button>
                            </div>
                        </div>
                    )}

                    <footer className="bg-white border-t border-gray-200 mt-20">
                        <div className="max-w-7xl mx-auto px-4 py-6 text-center text-slate-400 text-xs font-bold">
                            © 2026 ระบบบริหารจัดการโรงเรียนกุดจับประชาสรรค์ (School OS) • เชื่อมโยงฐานข้อมูลคลาวด์ Google Sheets เรียบร้อยแล้ว
                        </div>
                    </footer>

                </div>
            );
        }

        // เชื่อมต่อ React Component และเรนเดอร์ลงในเว็บ HTML
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
